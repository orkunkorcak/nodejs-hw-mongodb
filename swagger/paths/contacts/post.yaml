tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided details.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
         _id:
          type: string
          description: Unique identifier for the contact.
          example: '64e3b2f5c2a4d2b1e8f7a123'
         userId:
          type: string
          description: ID of the user who owns this contact.
          example: '64e3b2f5c2a4d2b1e8f7a456'
         name:
          type: string
          description: Full name of the contact.
          example: John Doe
         phoneNumber:
          type: string
          description: Primary phone number of the contact.
          example: '+1234567890'
         email:
          type: string
          description: Optional email address of the contact.
          example: 'john@doe.com'
         contactType:
          type: string
          description: Type of contact (e.g., personal, work, home).
          enum: ['work', 'home', 'personal']
         isFavourite:
          type: boolean
          description: Whether the contact is marked as favourite.
          example: false
         photo:
          type: string
          format: binary
          description: Optional contact photo URL.
responses:
  '201':
    description: Successfully created the contact.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: ../../components/responses/404.yaml