tags: 
  -  Contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve a list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: The page number for pagination.
    schema:
      type: integer
      default: 1
      example: 1
  - name: perPage
    in: query
    required: false
    description: The number of contacts per page.
    schema:
      type: integer
      default: 10
      example: 10
  - name: sortBy
    in: query
    required: false
    description: The field to sort the contacts by.
    schema:
      type: string
      default: _id
      example: name
  - name: sortOrder
    in: query
    required: false
    description: The order to sort the contacts (asc or desc).
    schema:
      type: string
      default: asc
      enum: [asc, desc]
      example: asc
  - name: isFavourite
    in: query
    required: false
    description: Filter contacts by their favourite status.
    schema:
      type: boolean
      example: true
  - name: contactType
    in: query
    required: false
    description: Filter contacts by their type (work, home, personal).
    schema:
      type: string
      enum: [work, home, personal]
      example: work
responses:
  '200':
    description: Successfully retrieved the list of contacts.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts!
            data:
              type: object
              required: 
                -  data
                - perPage
                - page
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                perPage:
                  type: number
                  example: 2
                page:
                  type: number
                  example: 17
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '404':
    $ref: "../../components/responses/404.yaml"
    
