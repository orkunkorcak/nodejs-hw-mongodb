tags: 
  - Contacts
summary: Update a contact
description: Updates a contact by ID.
operationId: updateContact
security: 
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: The ID of the contact.
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: '+1234567890'
          email:
            type: string
            format: email
            example: 'john@doe.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ['personal', 'work', 'home']
            example: 'personal'
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated the contact.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!